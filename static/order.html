<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>YUZDOKSANBES — Sipariş</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
           background:#F4EFE6; color:#1a1a1a; padding-bottom:120px; }
    .topbar { background:#1a1a1a; color:#F4EFE6; padding:16px; text-align:center; position:sticky; top:0; z-index:10; }
    .topbar h1 { font-size:18px; letter-spacing:1px; }
    .topbar .table { font-size:13px; color:#bbb; margin-top:2px; }

    .cats { display:flex; gap:8px; overflow-x:auto; padding:12px; position:sticky; top:62px;
            background:#F4EFE6; z-index:9; -webkit-overflow-scrolling:touch; }
    .cat-btn { white-space:nowrap; padding:9px 16px; border:2px solid #1a1a1a; border-radius:20px;
               background:#F4EFE6; font-weight:bold; font-size:12px; cursor:pointer; }
    .cat-btn.active { background:#1a1a1a; color:#F4EFE6; }

    .menu { padding:0 12px; }
    .menu-grid { display:none; grid-template-columns:repeat(2,1fr); gap:8px; padding-bottom:12px; }
    .menu-grid.active { display:grid; }
    .item-btn { background:#fff; border:1px solid #ddd; border-radius:10px; padding:14px 10px;
                display:flex; flex-direction:column; gap:6px; cursor:pointer; min-height:64px; }
    .item-btn:active { transform:scale(0.97); background:#f9f6f1; }
    .item-name { font-weight:600; font-size:13px; }
    .item-price { color:#b30000; font-weight:bold; font-size:13px; }

    .cart { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid #1a1a1a;
            max-height:55vh; display:flex; flex-direction:column; }
    .cart-head { padding:10px 14px; font-weight:bold; font-size:13px; letter-spacing:1px;
                 border-bottom:1px solid #eee; display:flex; justify-content:space-between; }
    .cart-body { overflow-y:auto; padding:4px 0; -webkit-overflow-scrolling:touch; }
    .cart-empty { text-align:center; color:#bbb; padding:18px; font-size:13px; }
    .crow { display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid #f3f0ea; }
    .crow .nm { flex:1; font-size:14px; min-width:0; overflow-wrap:anywhere; }
    .crow .pr { font-weight:bold; color:#b30000; min-width:56px; text-align:right; }
    .step { width:32px; height:32px; border:1.5px solid #ccc; border-radius:7px; background:#fff;
            font-size:18px; font-weight:bold; cursor:pointer; }
    .step:active { background:#eee; }
    .qty { min-width:24px; text-align:center; font-weight:bold; }
    .rm { width:32px; height:32px; border:1.5px solid #e3b5b5; border-radius:7px; background:#fff;
          color:#b30000; font-size:15px; font-weight:bold; cursor:pointer; flex-shrink:0; }
    .rm:active { background:#fde8e8; }
    .send { margin:10px 14px 14px; padding:16px; border:none; border-radius:12px; background:#1a1a1a;
            color:#F4EFE6; font-size:16px; font-weight:bold; cursor:pointer; width:calc(100% - 28px); }
    .send:disabled { opacity:0.4; }
    .send:active:not(:disabled) { transform:scale(0.98); }

    #toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
             background:#1a1a1a; color:#fff; padding:20px 28px; border-radius:14px; font-size:16px;
             font-weight:bold; z-index:100; display:none; text-align:center; max-width:80%; }
    .err { background:#fff3f3; color:#b30000; padding:30px; text-align:center; margin:40px 16px;
           border-radius:12px; font-weight:bold; }
</style>
</head>
<body>
    <div class="topbar">
        <h1>YUZDOKSANBES</h1>
        <div class="table" id="tableLabel"></div>
    </div>

    <div id="app" style="display:none;">
        <div class="cats" id="cats"></div>
        <div class="menu" id="menu"></div>

        <div class="cart">
            <div class="cart-head">
                <span>SİPARİŞİM</span>
                <span id="cartTotal">0 ₺</span>
            </div>
            <div class="cart-body" id="cartBody">
                <div class="cart-empty">Sipariş eklemek için ürünlere dokunun</div>
            </div>
            <button class="send" id="sendBtn" onclick="sendOrder()" disabled>Siparişi Gönder</button>
        </div>
    </div>

    <div id="errBox" class="err" style="display:none;"></div>
    <div id="toast"></div>

<script>
    const params  = new URLSearchParams(location.search);
    const TABLE   = parseInt(params.get('table'), 10);
    let MENU = {}, CURRENCY = '₺';
    function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    let cart = {};   // name -> {name, price, qty}
    let MENU_ITEMS = [];   // flat product list; buttons refer to it by index
    // Every product in the cart keeps one id until the order is confirmed by
    // the server: if "Gönder" is pressed again after a lost answer — even after
    // adding something more — what the server already has is not added twice.
    // Ids of a send that failed: the server MAY have them. If the customer then
    // removes such a product, the next send tells the server to take it back.
    let maybeSent = new Set(), withdrawn = [];
    function newId(){
        if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return 'q'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12)+Math.random().toString(36).slice(2,12);
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2200);
    }

    async function init() {
        if(!TABLE || TABLE < 1) {
            document.getElementById('errBox').style.display = 'block';
            document.getElementById('errBox').innerText = 'Masa numarası bulunamadı. Lütfen masanızdaki QR kodu tekrar okutun.';
            return;
        }
        document.getElementById('tableLabel').innerText = 'Masa ' + TABLE;
        const cfg = await (await fetch('/config')).json();
        // the café may have named this table ("Toplantı Masası") in Ayarlar → Masalar
        const nm = (cfg.table_names || {})[String(TABLE)];
        if(nm) document.getElementById('tableLabel').innerText = /^\d+$/.test(nm) ? 'Masa ' + nm : nm;
        MENU = cfg.menu; CURRENCY = cfg.currency || '₺';
        buildMenu();
        document.getElementById('app').style.display = 'block';
    }

    function buildMenu() {
        let cats = '', menu = '';
        MENU_ITEMS = [];
        Object.entries(MENU).forEach(([cat, items], idx) => {
            const id = 'c' + idx;
            cats += `<button class="cat-btn ${idx===0?'active':''}" onclick="showCat('${id}',this)">${esc(cat)}</button>`;
            menu += `<div class="menu-grid ${idx===0?'active':''}" id="${id}">`;
            items.forEach(it => {
                // only a number goes into onclick — a quote in a name can't break it
                const i = MENU_ITEMS.push(it) - 1;
                menu += `<button class="item-btn" onclick="addMenuItem(${i})">
                    <span class="item-name">${esc(it.name)}</span>
                    <span class="item-price">${esc(it.price)} ${esc(CURRENCY)}</span></button>`;
            });
            menu += `</div>`;
        });
        document.getElementById('cats').innerHTML = cats;
        document.getElementById('menu').innerHTML = menu;
    }

    function showCat(id, btn) {
        document.querySelectorAll('.menu-grid').forEach(g => g.classList.remove('active'));
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function addMenuItem(i) { const it = MENU_ITEMS[i]; if(it) addItem(it.name, it.price); }
    function addItem(name, price) {
        if(!cart[name]) cart[name] = {name, price, qty:0, cid:newId()};
        cart[name].qty++;
        renderCart();
    }
    function changeQty(name, d) {
        if(!cart[name]) return;
        cart[name].qty += d;
        if(cart[name].qty <= 0) {
            if(maybeSent.has(cart[name].cid)) withdrawn.push(cart[name].cid);
            delete cart[name];
            // everything removed: nothing left to "send", so take it back right away
            if(Object.keys(cart).length === 0 && withdrawn.length) flushWithdraw();
        }
        renderCart();
    }
    // ✕ : take the whole product out of the cart in one tap (wrong product chosen)
    function removeAt(k) { const name = Object.keys(cart)[k]; if(name !== undefined) changeQty(name, -cart[name].qty); }
    function changeQtyAt(k, d) { const name = Object.keys(cart)[k]; if(name !== undefined) changeQty(name, d); }

    function renderCart() {
        const items = Object.values(cart);
        const body = document.getElementById('cartBody');
        if(items.length === 0) {
            body.innerHTML = '<div class="cart-empty">Sipariş eklemek için ürünlere dokunun</div>';
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('cartTotal').innerText = '0 ' + CURRENCY;
            return;
        }
        let html = '', total = 0;
        items.forEach((i, k) => {
            total += i.qty * i.price;
            html += `<div class="crow">
                <button class="step" onclick="changeQtyAt(${k},-1)">−</button>
                <span class="qty">${i.qty}</span>
                <button class="step" onclick="changeQtyAt(${k},1)">+</button>
                <span class="nm">${esc(i.name)}</span>
                <span class="pr">${(i.qty*i.price).toFixed(0)} ${CURRENCY}</span>
                <button class="rm" onclick="removeAt(${k})" aria-label="Ürünü çıkar" title="Ürünü çıkar">✕</button>
            </div>`;
        });
        body.innerHTML = html;
        document.getElementById('cartTotal').innerText = total.toFixed(0) + ' ' + CURRENCY;
        document.getElementById('sendBtn').disabled = false;
    }

    // The cart was emptied after a failed send: ask the server to drop whatever
    // it stored from that send (only lines staff have not accepted yet).
    async function flushWithdraw() {
        const ids = withdrawn.slice();
        try {
            const res = await fetch('/create-order', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({table_no: TABLE, items: [], withdraw: ids})
            });
            if(res.ok) { withdrawn = withdrawn.filter(c => !ids.includes(c)); ids.forEach(c => maybeSent.delete(c)); }
        } catch(e) {}      // still offline: sent along with the next order instead
    }

    async function sendOrder() {
        if(Object.keys(cart).length === 0) return;
        const items = Object.values(cart).map(i => ({product_name:i.name, quantity:i.qty, price:i.price,
                                                      client_id: i.cid || (i.cid = newId())}));
        document.getElementById('sendBtn').disabled = true;
        try {
            // No token => server treats this as 'customer' => order lands 'pending'.
            const res = await fetch('/create-order', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({table_no: TABLE, items, withdraw: withdrawn})
            });
            if(!res.ok) {
                const d = await res.json().catch(() => ({}));
                throw new Error(typeof d.detail === 'string' ? d.detail : '');
            }
            cart = {}; maybeSent = new Set(); withdrawn = []; renderCart();
            showToast('Siparişiniz alındı! ✓\nGörevli onaylayacaktır.');
        } catch(e) {
            items.forEach(i => maybeSent.add(i.client_id));      // the server may have stored them
            showToast(e.message && !/fetch|network|load/i.test(e.message) ? e.message : 'Gönderilemedi, tekrar deneyin.');
            document.getElementById('sendBtn').disabled = false;
        }
    }

    init();
</script>
</body>
</html>
