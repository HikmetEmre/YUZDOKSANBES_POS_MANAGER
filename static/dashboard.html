<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUZDOKSANBES — Yönetim</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
        --ink:#1a1a1a; --cream:#F4EFE6; --paper:#fff; --line:#e8e2d6;
        --red:#b30000; --green:#2e7d32; --muted:#8a8275; --amber:#f9a825;
    }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
           background:var(--cream); color:var(--ink); }

    /* layout: sidebar | content */
    .wrap { display:flex; min-height:100vh; }
    .sidebar { width:210px; background:var(--ink); color:var(--cream); flex-shrink:0;
               display:flex; flex-direction:column; padding:18px 0; }
    .brand { padding:0 20px 18px; font-weight:bold; letter-spacing:1px; font-size:16px;
             border-bottom:1px solid #333; margin-bottom:10px; }
    .nav-item { padding:13px 20px; cursor:pointer; font-weight:600; font-size:14px;
                color:#bdb6a8; display:flex; gap:10px; align-items:center; border-left:3px solid transparent; }
    .nav-item:hover { background:#262626; color:var(--cream); }
    .nav-item.active { background:#262626; color:var(--cream); border-left-color:var(--amber); }
    .nav-spacer { flex:1; }
    .nav-logout { padding:13px 20px; cursor:pointer; font-size:13px; color:#e57373; font-weight:600; }

    .content { flex:1; padding:24px 28px; overflow-y:auto; }
    .page-title { font-size:22px; font-weight:bold; margin-bottom:4px; }
    .page-sub { color:var(--muted); font-size:13px; margin-bottom:22px; }
    .home-clock { font-size:22px; font-weight:bold; color:#000; margin-bottom:4px;
                  font-variant-numeric:tabular-nums; white-space:nowrap; }

    /* HOME: two columns */
    .home-grid { display:grid; grid-template-columns:1fr 1.1fr; gap:22px; }
    @media (max-width:900px){ .home-grid{ grid-template-columns:1fr; } }

    .card { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:20px; }
    .card h3 { font-size:12px; letter-spacing:1px; color:var(--muted); margin-bottom:14px; text-transform:uppercase; }

    /* summary stats */
    .stat-row { display:flex; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
    .stat { flex:1; min-width:120px; background:var(--cream); border-radius:11px; padding:14px; }
    .stat .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
    .stat .value { font-size:26px; font-weight:bold; margin-top:4px; }
    .stat .value.green { color:var(--green); }
    .stat .value.blue { color:#1565c0; }
    .top-items { list-style:none; }
    .top-items li { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
    .top-items li:last-child { border-bottom:none; }
    .top-items .q { font-weight:bold; }

    /* calendar */
    .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .cal-head button { background:var(--cream); border:1px solid var(--line); border-radius:8px;
                       width:34px; height:34px; font-size:18px; cursor:pointer; }
    .cal-nav { background:var(--cream); border:1px solid var(--line); border-radius:8px;
               width:34px; height:34px; font-size:18px; cursor:pointer; }

    .alert-banner { background:#fff8e1; border:1.5px solid var(--amber); border-radius:10px;
                    padding:13px 16px; margin-bottom:14px; font-weight:600; font-size:14px; cursor:pointer; }
    .alert-banner:hover { background:#fff3cd; }
    .alert-banner.low { background:#fff5f5; border-color:var(--red); color:#b71c1c; }

    /* ── PLAN (Schedule) ── */
    .plan-filter-btn { padding:6px 14px; border:1.5px solid var(--line); border-radius:20px;
                       background:#fff; font-size:12px; font-weight:600; cursor:pointer; color:var(--ink); }
    .plan-filter-btn.active { background:var(--ink); color:var(--cream); border-color:var(--ink); }
    .plan-task { display:flex; align-items:flex-start; gap:10px; padding:11px 12px;
                 border:1px solid var(--line); border-radius:11px; margin-bottom:8px;
                 background:var(--paper); transition:opacity .15s; }
    .plan-task.done { opacity:.5; }
    .plan-task.done .pt-title { text-decoration:line-through; }
    .pt-title { font-size:14px; font-weight:600; word-break:break-word; }
    .pt-edit { background:none; border:none; cursor:pointer; font-size:15px; padding:0 4px; opacity:.5; }
    .pt-edit:hover { opacity:1; }
    .plan-edit-input { font-size:14px; font-weight:600; border:none; border-bottom:2px solid var(--ink);
                       outline:none; background:transparent; width:100%; padding:2px 0; }

    .stock-low-tag { background:var(--red); color:#fff; font-size:11px; font-weight:bold;
                     padding:2px 8px; border-radius:10px; margin-left:8px; }
    .stock-qty { font-weight:bold; font-size:16px; }
    .stock-qty.low { color:var(--red); }
    /* product name in the Mevcut Stok list — larger for readability */
    .stock-name { font-size:15px; font-weight:600; letter-spacing:0.2px; }
    /* smaller green "Kaydet" button used in the stock rows */
    .btn-save-sm { padding:5px 11px; background:var(--green); color:#fff; border:none;
                   border-radius:7px; font-weight:bold; font-size:12px; cursor:pointer; }
    .btn-save-sm:hover { filter:brightness(1.08); }
    .cal-head .month { font-weight:bold; font-size:16px; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
    .cal-dow { text-align:center; font-size:11px; color:var(--muted); font-weight:bold; padding-bottom:4px; }
    .cal-cell { aspect-ratio:1; border:1px solid var(--line); border-radius:9px; padding:5px;
                cursor:pointer; position:relative; display:flex; flex-direction:column; background:var(--paper); }
    .cal-cell:hover { border-color:var(--ink); }
    .cal-cell.empty { border:none; cursor:default; background:transparent; }
    .cal-cell.today { background:#fdf6e3; border-color:var(--amber); }
    .cal-cell.selected { outline:2px solid var(--ink); outline-offset:1px; }
    .cal-cell .d { font-size:13px; font-weight:600; }
    .cal-dots { display:flex; gap:3px; margin-top:auto; flex-wrap:wrap; }
    .cal-dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
    .cal-dot.pending { background:var(--amber); }
    .cal-dot.overdue { background:var(--red); }

    /* task panel */
    .task-day-title { font-weight:bold; font-size:15px; margin:18px 0 10px; }
    .task-add { display:flex; gap:8px; margin-bottom:12px; }
    .task-add input { flex:1; padding:11px; border:1px solid var(--line); border-radius:9px; font-size:14px; }
    .task-add select { padding:11px; border:1px solid var(--line); border-radius:9px; font-size:13px; background:#fff; }
    .task-add button { padding:11px 16px; background:var(--ink); color:var(--cream); border:none;
                       border-radius:9px; font-weight:bold; cursor:pointer; }
    .task-list { list-style:none; }
    .task-item { display:flex; align-items:center; gap:10px; padding:11px; border:1px solid var(--line);
                 border-radius:10px; margin-bottom:8px; background:var(--paper); }
    .task-item.done { opacity:0.55; }
    .task-item.done .t-title { text-decoration:line-through; }
    .task-item.overdue { border-color:var(--red); background:#fff5f5; }
    .t-check { width:24px; height:24px; border:2px solid #bbb; border-radius:7px; cursor:pointer; flex-shrink:0;
               display:flex; align-items:center; justify-content:center; font-weight:bold; color:#fff; }
    .task-item.done .t-check { background:var(--green); border-color:var(--green); }
    .t-body { flex:1; }
    .t-title { font-size:14px; font-weight:600; }
    .t-cat { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; }
    .t-overdue-mark { color:var(--red); font-weight:bold; font-size:18px; }
    .t-del { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px;
             width:28px; height:28px; border-radius:50%; padding:0; line-height:1;
             display:inline-flex; align-items:center; justify-content:center;
             transition:background .15s, color .15s; }
    .t-del:hover { background:#fdecec; color:var(--red); }
    .empty-note { color:var(--muted); font-size:13px; padding:14px 0; text-align:center; }

    /* ── KAHVE MAKİNESİ ── */
    .coffee-big { font-size:44px; font-weight:800; line-height:1.1; color:var(--ink); }
    .coffee-big .of { font-size:20px; color:var(--muted); font-weight:700; }
    .coffee-bar { height:14px; background:#eee8dd; border-radius:8px; overflow:hidden; margin:12px 0 8px; }
    .coffee-bar > div { height:100%; background:var(--green); border-radius:8px; transition:width .3s; }
    .coffee-bar.near > div { background:var(--amber); }
    .coffee-bar.due  > div { background:var(--red); }
    .coffee-meta { font-size:12px; color:var(--muted); }
    .coffee-due-tag { display:inline-block; background:var(--red); color:#fff; font-size:12px; font-weight:bold;
                      padding:3px 10px; border-radius:10px; margin-left:8px; vertical-align:middle; }
    .coffee-field { display:flex; align-items:center; gap:10px; margin-top:16px; font-size:14px; font-weight:600; }
    .coffee-field input { width:100px; padding:8px; border:1px solid var(--line); border-radius:8px; text-align:center; font-size:15px; }
    .coffee-sections { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-size:13px; }
    .coffee-sections label { display:flex; align-items:center; gap:5px; cursor:pointer; }
    .coffee-log-row { display:flex; justify-content:space-between; gap:8px; padding:7px 0;
                      border-bottom:1px solid var(--line); font-size:13px; }
    .coffee-log-row .when { color:var(--muted); font-size:12px; white-space:nowrap; }
    /* ── REÇETELER ── */
    .rc-add { display:grid; grid-template-columns: 1fr 1.6fr 1.8fr auto; gap:8px; align-items:start; }
    .rc-add input, .rc-add textarea { padding:10px; border:1px solid var(--line); border-radius:8px;
                                      font:inherit; font-size:13px; resize:none; overflow:hidden; width:100%; }
    .rc-add button { padding:10px 18px; background:var(--ink); color:var(--cream); border:none;
                     border-radius:8px; font-weight:bold; cursor:pointer; }
    .rc-search { padding:8px 12px; border:1px solid var(--line); border-radius:20px; font-size:13px; min-width:220px; }
    .rc-table { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
    .rc-table th { text-align:left; padding:8px 6px; background:#eef2f3; font-size:12px; }
    .rc-table td { padding:5px 3px; vertical-align:top; border-bottom:1px solid var(--line); }
    .rc-table input, .rc-table textarea { width:100%; border:1px solid transparent; border-radius:7px;
                     padding:7px; font:inherit; font-size:13px; background:transparent; resize:none;
                     overflow:hidden; line-height:1.45; }
    .rc-table input:hover, .rc-table textarea:hover { border-color:var(--line); }
    .rc-table input:focus, .rc-table textarea:focus { border-color:var(--ink); background:#fff; outline:none; }
    .rc-table .rc-name { font-weight:700; font-size:14px; }
    .rc-save { padding:6px 10px; background:var(--green); color:#fff; border:none; border-radius:7px;
               font-weight:bold; font-size:12px; cursor:pointer; margin-top:3px; white-space:nowrap; }
    .rc-save.dirty { background:var(--amber); color:var(--ink); }
    @media (max-width: 900px) { .rc-add { grid-template-columns: 1fr; } }
    /* ── İPTAL EDİLENLER ── */
    .cx-table { width:100%; border-collapse:collapse; font-size:13px; }
    .cx-table th { text-align:left; padding:8px 6px; background:#eef2f3; font-size:12px; white-space:nowrap; }
    .cx-table td { padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
    .cx-reason-tag { background:#fdecec; color:var(--red); font-weight:700; font-size:12px; padding:2px 8px; border-radius:10px; white-space:nowrap; }
    /* ── RAPORLAR: date range ── */
    .rng-quick { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .rng-quick button { padding:6px 12px; border:1.5px solid var(--line); background:#fff; border-radius:20px;
                        font-size:12px; font-weight:600; cursor:pointer; }
    .rng-quick button:hover { border-color:var(--ink); }
    .rng-row { align-items:flex-end; flex-wrap:wrap; }
    .rng-row label { display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:var(--muted); flex:1; min-width:150px; }
    /* ── AYARLAR → MASALAR ── */
    .ta-area { border:1px solid var(--line); border-radius:11px; padding:12px; margin-bottom:10px; background:var(--paper); }
    .ta-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .ta-name { flex:1; min-width:160px; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
               font-weight:700; font-size:15px; }
    .ta-count { color:var(--muted); font-size:12px; }
    .ta-del-area { padding:6px 10px; border:1px solid var(--red); color:var(--red); background:#fff;
                   border-radius:7px; cursor:pointer; font-size:12px; }
    .ta-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .ta-chip { display:inline-flex; align-items:center; gap:4px; padding:5px 6px 5px 11px; border:1.5px solid var(--ink);
               border-radius:20px; font-weight:700; font-size:14px; background:#fff; }
    .ta-chip button { border:none; background:none; color:var(--muted); cursor:pointer; font-size:12px;
                      width:20px; height:20px; border-radius:50%; padding:0; }
    .ta-chip button:hover { background:#fdecec; color:var(--red); }
    .ta-chip.open { border-color:var(--red); color:var(--red); padding-right:11px; }
    .ta-chip .dot { font-size:10px; }
    .ta-chip.open button { color:var(--red); }
    .ta-chip.editing { padding:3px 4px; gap:4px; }
    .ta-chip.editing input { width:170px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
    .ta-chip.editing .ok { color:var(--green, #2e7d32); font-weight:bold; }
    .ta-add { display:flex; gap:8px; }
    .ta-add input { flex:1; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
    .ta-add button { padding:9px 16px; background:var(--ink); color:var(--cream); border:none; border-radius:8px;
                     font-weight:bold; cursor:pointer; }
    .maint-row { display:flex; align-items:flex-start; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; }

    /* "coming soon" sections */
    .soon { text-align:center; color:var(--muted); padding:60px 20px; }
    .soon .big { font-size:40px; margin-bottom:10px; }

    /* PIN modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(26,26,26,0.55); display:flex;
                     align-items:center; justify-content:center; z-index:100; }
    .modal-box { background:var(--paper); border-radius:16px; padding:28px; width:300px; text-align:center; }
    .modal-box h2 { font-size:18px; letter-spacing:1px; margin-bottom:4px; }
    .modal-box p { color:var(--muted); font-size:13px; margin-bottom:14px; }
    .modal-box input { width:100%; padding:13px; font-size:18px; text-align:center; letter-spacing:6px;
                       border:2px solid var(--line); border-radius:10px; margin-bottom:8px; }
    .modal-box button { width:100%; padding:13px; background:var(--ink); color:var(--cream); border:none;
                        border-radius:10px; font-weight:bold; cursor:pointer; }
    #pinError { color:var(--red); font-size:13px; min-height:18px; margin-bottom:6px; }

    #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink);
             color:#fff; padding:13px 22px; border-radius:10px; font-weight:600; z-index:200; display:none; }
</style>
</head>
<body>

<div id="pinModal" class="modal-overlay">
    <div class="modal-box">
        <h2>YÖNETİM</h2>
        <p>Yönetici girişi (checkout PIN)</p>
        <input type="password" id="pinInput" maxlength="16" placeholder="Şifre" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
        <div id="pinError"></div>
        <button onclick="checkPin()">Giriş</button>
    </div>
</div>

<div class="wrap" id="app" style="display:none;">
    <div class="sidebar">
        <div class="brand">YUZDOKSANBES</div>
        <div class="nav-item active" data-page="home"     onclick="nav('home',this)">🏠 Anasayfa</div>
        <div class="nav-item"        data-page="reports"  onclick="nav('reports',this)">📊 Raporlar</div>
        <div class="nav-item"        data-page="cancels"  onclick="nav('cancels',this)">🚫 İptal Edilenler</div>
        <div class="nav-item"        data-page="stock"    onclick="nav('stock',this)">📦 Stok</div>
        <div class="nav-item"        data-page="coffee"   onclick="nav('coffee',this)">☕ Kahve Makinesi</div>
        <div class="nav-item"        data-page="recipes"  onclick="nav('recipes',this)">📖 Reçeteler</div>
        <div class="nav-item"        data-page="expenses" onclick="nav('expenses',this)">🧾 Gelir/Gider</div>
        <div class="nav-item"        data-page="schedule" onclick="nav('schedule',this)">🗓️ Plan</div>
        <div class="nav-item"        data-page="settings" onclick="nav('settings',this)">⚙️ Ayarlar</div>
        <div class="nav-spacer"></div>
        <div class="nav-logout" onclick="logout()">⎋ Çıkış</div>
        <div id="appVersion" style="padding:0 20px 14px;font-size:11px;color:#777;"></div>
    </div>

    <div class="content" id="content"></div>
</div>

<div id="toast"></div>

<script>
    // ===== auth =====
    let AUTH_TOKEN = sessionStorage.getItem('dash_token') || null;
    function authFetch(url, opts={}) {
        opts.headers = opts.headers || {};
        if(AUTH_TOKEN) opts.headers['Authorization'] = 'Bearer ' + AUTH_TOKEN;
        // Always hit the server (LAN is fast) so deletions/edits made elsewhere
        // never show up stale from the browser's GET cache.
        if(!('cache' in opts)) opts.cache = 'no-store';
        const sent = AUTH_TOKEN;
        // 401 = session no longer valid (password changed / expired) → login again
        return fetch(url, opts).then(res => { if(res.status === 401 && sent) { sessionExpired(); return new Promise(() => {}); } return res; });
    }
    let _expiring = false;
    function sessionExpired() {
        if(_expiring) return; _expiring = true;
        sessionStorage.removeItem('dash_token'); AUTH_TOKEN = null;
        alert('Oturum sona erdi (şifre değişmiş olabilir). Lütfen yeniden giriş yapın.');
        location.reload();
    }
    async function checkPin() {
        const val = document.getElementById('pinInput').value;
        try {
            const res = await fetch('/auth', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pin:val})});
            if(res.ok) {
                const d = await res.json();
                if(d.role !== 'checkout') {   // only admin/checkout may enter
                    document.getElementById('pinError').innerText = 'Yönetici yetkisi gerekli.';
                    return;
                }
                AUTH_TOKEN = d.token;
                sessionStorage.setItem('dash_token', AUTH_TOKEN);
                document.getElementById('pinModal').style.display='none';
                document.getElementById('app').style.display='flex';
                nav('home', document.querySelector('.nav-item'));
            } else {
                document.getElementById('pinError').innerText = 'Hatalı şifre.';
            }
        } catch(e) { document.getElementById('pinError').innerText = 'Sunucuya ulaşılamadı.'; }
    }
    function logout() {
        if(!confirm('Çıkış yapılsın mı?')) return;
        sessionStorage.removeItem('dash_token'); AUTH_TOKEN=null; location.reload();
    }

    function esc(s){const m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};return String(s==null?'':s).replace(/[&<>"']/g,c=>m[c]);}
    function showToast(msg){const t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}
    const TR_MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
    const TR_DOW=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
    function ymd(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
    function todayYMD(){return ymd(new Date());}
    // Format a stored ISO timestamp (datetime.now().isoformat(), local time) as
    // "dd-mm-yyyy HH:MM". Used by the Stock tab (last-counted + count history).
    function fmtDate(s){
        if(!s) return '';
        const d = new Date(s);
        if(isNaN(d.getTime())) return String(s);
        const p = n => String(n).padStart(2,'0');
        return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    // Stock is tracked in whole units — round for display everywhere.
    function whole(n){ return Math.round(Number(n) || 0); }

    // ===== navigation =====
    let currentPage = 'home';

    function nav(page, el) {
        currentPage = page;
        document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
        if(el) el.classList.add('active');
        if(page==='home') renderHome();
        else if(page==='reports') renderReports();
        else if(page==='cancels') renderCancels();
        else if(page==='expenses') renderFinance();
        else if(page==='stock') renderStock();
        else if(page==='coffee') renderCoffee();
        else if(page==='recipes') renderRecipes();
        else if(page==='schedule') renderSchedule();
        else if(page==='settings') renderSettings();
        else renderSoon(page);
    }

    // Auto-refresh the active data page every 60s so sales made/removed
    // elsewhere (e.g. a sale deleted on the POS "Satışlar" table) show up

    function renderPieChart() {
        if(!finData) return;
        const inc = finData.total_income;
        const exp = finData.total_expenses;
        const net = finData.net_income;
        const canvas = document.getElementById('pieChart');
        if(!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        const cx = W/2, cy = H/2, R = Math.min(W,H)/2 - 20;
        ctx.clearRect(0, 0, W, H);

        if(inc === 0 && exp === 0) {
            ctx.fillStyle = 'var(--muted)';
            ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('Henüz veri yok', cx, cy);
            document.getElementById('pieLegend').innerHTML = '';
            return;
        }

        const total = inc + exp;
        const slices = [
            { label: 'Gelir',  val: inc, color: '#43a047' },
            { label: 'Gider',  val: exp, color: '#e53935' },
        ];
        let start = -Math.PI / 2;
        slices.forEach(s => {
            const angle = (s.val / total) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, R, start, start + angle);
            ctx.closePath();
            ctx.fillStyle = s.color;
            ctx.fill();
            // label
            if(s.val > 0) {
                const mid = start + angle / 2;
                const lx = cx + Math.cos(mid) * R * 0.6;
                const ly = cy + Math.sin(mid) * R * 0.6;
                ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(Math.round(s.val/total*100) + '%', lx, ly);
            }
            start += angle;
        });
        // Donut hole
        ctx.beginPath(); ctx.arc(cx, cy, R*0.45, 0, Math.PI*2);
        ctx.fillStyle = '#fff'; ctx.fill();
        // Net in center
        ctx.fillStyle = net >= 0 ? '#2e7d32' : '#c62828';
        ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(net.toFixed(0) + ' ₺', cx, cy - 2);
        ctx.fillStyle = '#888'; ctx.font = '11px sans-serif';
        ctx.fillText('Net Kâr', cx, cy + 16);

        // Legend
        document.getElementById('pieLegend').innerHTML = `
            <div style="display:flex;justify-content:center;gap:20px;font-size:13px;">
                <span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#43a047;margin-right:4px;"></span>Gelir: <b>${inc.toFixed(0)} ₺</b></span>
                <span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#e53935;margin-right:4px;"></span>Gider: <b>${exp.toFixed(0)} ₺</b></span>
            </div>`;
    }

    // calendar state (reuse calYear/calMonth from home, or own)
    let planCalYear = new Date().getFullYear();
    let planCalMonth = new Date().getMonth();

    function planCalPrev() { planCalMonth--; if(planCalMonth<0){planCalMonth=11;planCalYear--;} planRenderCal(); }
    function planCalNext() { planCalMonth++; if(planCalMonth>11){planCalMonth=0;planCalYear++;} planRenderCal(); }

    function planRenderCal() {
        document.getElementById('planCalMonth').innerText = `${TR_MONTHS[planCalMonth]} ${planCalYear}`;
        document.getElementById('planCalDow').innerHTML = TR_DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
        const first = (new Date(planCalYear, planCalMonth, 1).getDay()+6)%7;
        const days  = new Date(planCalYear, planCalMonth+1, 0).getDate();
        const today = todayYMD();
        const prefix = `${planCalYear}-${String(planCalMonth+1).padStart(2,'0')}`;

        // build day→task summary for dots
        const dayMap = {};
        planTasks.forEach(t => {
            if(!t.task_date.startsWith(prefix)) return;
            if(!dayMap[t.task_date]) dayMap[t.task_date] = {pending:0,done:0,overdue:0};
            if(t.done) dayMap[t.task_date].done++;
            else if(t.task_date < today) dayMap[t.task_date].overdue++;
            else dayMap[t.task_date].pending++;
        });

        let html = '';
        for(let i=0;i<first;i++) html+='<div class="cal-cell empty"></div>';
        for(let d=1;d<=days;d++){
            const ds = `${prefix}-${String(d).padStart(2,'0')}`;
            const info = dayMap[ds];
            let dots = '';
            if(info) {
                if(info.overdue) dots+=`<span class="cal-dot overdue"></span>`;
                if(info.pending) dots+=`<span class="cal-dot pending"></span>`;
                if(info.done)    dots+=`<span class="cal-dot" style="background:var(--green)"></span>`;
            }
            const cls = ['cal-cell'];
            if(ds===today) cls.push('today');
            if(planFilter===ds) cls.push('selected');
            html+=`<div class="${cls.join(' ')}" onclick="planClickDay('${ds}')">
                     <span class="d">${d}</span>
                     <div class="cal-dots">${dots}</div>
                   </div>`;
        }
        document.getElementById('planCalGrid').innerHTML = html;
    }

    function planClickDay(ds) {
        planFilter = (planFilter===ds) ? null : ds;   // toggle off if same day
        document.querySelectorAll('.plan-filter-btn').forEach(b=>b.classList.remove('active'));
        document.getElementById('pf-all').classList.add('active');
        planRenderCal();
        planRenderList();
    }

    async function loadPlanTasks() {
        try { planTasks = (await (await authFetch('/tasks')).json()).tasks || []; }
        catch(e){ planTasks=[]; }
    }

    function planSetFilter(type, btn) {
        planFilter = type;
        document.querySelectorAll('.plan-filter-btn').forEach(b=>b.classList.remove('active'));
        if(btn) btn.classList.add('active');
        planRenderCal();
        planRenderList();
    }

    function planRenderList() {
        const today = todayYMD();
        const weekEnd = (() => { const d=new Date(); d.setDate(d.getDate()+6); return ymd(d); })();
        const el = document.getElementById('planList');
        if(!el) return;

        // apply filter
        let tasks = [...planTasks];
        if(planFilter === 'today')   tasks = tasks.filter(t=>t.task_date===today);
        else if(planFilter==='week') tasks = tasks.filter(t=>t.task_date>=today && t.task_date<=weekEnd);
        else if(planFilter==='overdue') tasks = tasks.filter(t=>!t.done && t.task_date<today);
        else if(planFilter==='done') tasks = tasks.filter(t=>t.done);
        else if(planFilter && planFilter.match(/^\d{4}-\d{2}-\d{2}$/)) tasks = tasks.filter(t=>t.task_date===planFilter);
        // default: all

        if(!tasks.length) {
            el.innerHTML='<div class="empty-note" style="padding:30px;">Bu filtrede görev yok</div>';
            return;
        }

        // group: overdue | today | upcoming | future | done
        const groups = [
            { key:'overdue',  label:'⚠️ Gecikmiş',   items:[], colour:'#b71c1c', bg:'#fff5f5' },
            { key:'today',    label:'📌 Bugün',       items:[], colour:'#1565c0', bg:'#e3f2fd' },
            { key:'upcoming', label:'📅 Bu Hafta',    items:[], colour:'var(--ink)', bg:'var(--cream)' },
            { key:'future',   label:'🔜 Gelecek',     items:[], colour:'var(--muted)', bg:'var(--cream)' },
            { key:'done',     label:'✓ Tamamlanan',   items:[], colour:'var(--green)', bg:'#f1f8f2' },
        ];
        tasks.forEach(t => {
            if(t.done)                          groups[4].items.push(t);
            else if(t.task_date < today)        groups[0].items.push(t);
            else if(t.task_date === today)      groups[1].items.push(t);
            else if(t.task_date <= weekEnd)     groups[2].items.push(t);
            else                                groups[3].items.push(t);
        });

        let html = '';
        groups.forEach(g => {
            if(!g.items.length) return;
            g.items.sort((a,b)=>a.task_date.localeCompare(b.task_date));
            html += `<div style="margin-bottom:18px;">
                <div style="font-weight:700;font-size:12px;letter-spacing:1px;color:${g.colour};
                            text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;
                            border-bottom:2px solid ${g.colour}40;">${g.label}</div>`;
            g.items.forEach(t => {
                const dd = t.task_date.split('-').reverse().join('-');
                const catC = catColour(t.category);
                html += `
                <div class="plan-task ${t.done?'done':''}" id="ptask_${t.id}">
                    <div class="t-check" onclick="planToggle(${t.id},${t.done?0:1})">${t.done?'✓':''}</div>
                    <div class="t-body" style="flex:1;">
                        <div class="pt-title" id="ptitle_${t.id}">${esc(t.title)}</div>
                        <div style="display:flex;gap:8px;align-items:center;margin-top:3px;">
                            <span style="font-size:11px;font-weight:700;color:${catC};
                                         text-transform:uppercase;">${esc(t.category)}</span>
                            <span style="font-size:11px;color:var(--muted);">${dd}</span>
                        </div>
                    </div>
                    <button class="pt-edit" onclick="planEdit(${t.id})" title="Düzenle">✏️</button>
                    <button class="t-del"   onclick="planDelete(${t.id})">✕</button>
                </div>`;
            });
            html += `</div>`;
        });
        el.innerHTML = html;
    }

    function planEdit(id) {

    function toggleOther(id) {

    async function saveCount(id) {
        const qtyEl = document.getElementById('cnt_'+id);
        const qty = whole(qtyEl.value);
        if(qtyEl.value === '' || isNaN(parseFloat(qtyEl.value))){ showToast('Miktar girin'); return; }
        let by = document.getElementById('by_'+id).value;
        if(by === '__other') by = document.getElementById('byo_'+id).value.trim();
        if(!by){ showToast('Sayan kişiyi seçin'); return; }
        await authFetch('/stock/count',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id, quantity:qty, counted_by:by})});
        showToast('Sayım kaydedildi ✓');
        await loadStock(); loadStockLogs();
    }

    async function saveThreshold(id) {
        const el = document.getElementById('th_'+id);
        const v = whole(el.value);
        if(el.value === '' || isNaN(parseFloat(el.value)) || v < 0){ showToast('Geçerli alt limit girin'); return; }
        const it = stockItems.find(x => x.id === id);
        let res;
        try {
            res = await authFetch('/stock/set-threshold',{method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify({id, threshold:v})});
        } catch(e) { res = null; }
        if(!res || !res.ok){
            showToast('Alt limit kaydedilemedi!');
            if(it) el.value = whole(it.threshold);   // revert to the saved value
            return;
        }
        // Update only this row in place — re-rendering the table would wipe
        // unsaved "Yeni Sayım" / "Sayan" entries in the other rows.
        if(it){
            it.threshold = v;
            it.low = whole(it.quantity) < v;       // same rule as the server (_is_low)
            document.getElementById('lowtag_'+id).style.display = it.low ? '' : 'none';
            document.getElementById('qty_'+id).classList.toggle('low', it.low);
        }
        el.value = v;
        showToast('Alt limit güncellendi ✓');
    }

    // full=true also fills the inputs/checkboxes (first draw). The 60 s refresh
    // calls loadCoffee() without it, so it never overwrites something being typed.
    async function loadCoffee(full) {
        let d;
        try {
            const res = await authFetch('/coffee/status');
            if(!res.ok) throw new Error();
            d = await res.json();
        } catch(e) {
            const c = document.getElementById('coffeeCounter');
            if(c) c.innerHTML = '<div class="empty-note">Yüklenemedi</div>';
            return;
        }
        if(currentPage !== 'coffee' || !document.getElementById('coffeeCounter')) return;
        renderCoffeeCounter(d);
        const th = document.getElementById('coffeeThreshold');
        if(full || document.activeElement !== th) th.value = d.threshold;
        if(full) {
            document.getElementById('coffeeSections').innerHTML = d.sections.map(s =>
                `<label><input type="checkbox" value="${esc(s.name)}" ${s.selected?'checked':''} onchange="saveCoffeeSections()"> ${esc(s.name)}</label>`
            ).join('');
            document.getElementById('coffeeExtras').innerText =
                d.extra_items.length ? 'Ayrıca sayılan: ' + d.extra_items.join(', ') : '';
        }
        document.getElementById('coffeeLog').innerHTML = d.recent.length
            ? d.recent.map(r => `<div class="coffee-log-row">
                    <span><b>${esc(r.product)}</b> ×${whole(r.qty)} <span style="color:var(--muted);">· ${esc(r.table_label || 'Masa ' + r.table_no)}</span></span>
                    <span class="when">${fmtDate(r.time)}</span></div>`).join('')
            : '<div class="empty-note">Son bakımdan beri kahve yok</div>';
        document.getElementById('maintList').innerHTML = d.maintenance.length
            ? d.maintenance.map(m => `<div class="maint-row">
                    <div style="flex:1;min-width:0;">
                        <div style="display:flex;justify-content:space-between;gap:8px;">
                            <b>🔧 ${fmtDate(m.done_at)}</b>
                            <span style="color:var(--muted);white-space:nowrap;">${m.coffee_count ?? 0} kahve sonra</span>
                        </div>
                        ${m.note ? `<div style="color:var(--muted);font-size:12px;word-break:break-word;">${esc(m.note)}</div>` : ''}
                    </div>
                    <button class="t-del" onclick="delMaintenance(${m.id})" title="Bu kaydı sil">✕</button>
                </div>`).join('')
            : '<div class="empty-note">Henüz bakım kaydı yok</div>';
    }

    function renderCoffeeCounter(d) {
        const pct = Math.min(100, d.threshold ? d.count / d.threshold * 100 : 0);
        const cls = d.due ? 'due' : (d.near ? 'near' : '');
        document.getElementById('coffeeCounter').innerHTML = `
            <div class="coffee-big">${d.count} <span class="of">/ ${d.threshold} kahve</span>
                ${d.due ? '<span class="coffee-due-tag">BAKIM ZAMANI</span>' : ''}</div>

                ${d.since ? ' · Sayım başlangıcı: ' + fmtDate(d.since) : ''}</div>`;
    }

    async function postJSON(url, body) {

        const el = document.getElementById('coffeeThreshold');

        if(!res || !res.ok) { showToast('Eşik kaydedilemedi!'); loadCoffee(true); return; }
        el.value = v;
        showToast('Bakım eşiği güncellendi ✓');

            </div>`;
        let d;
        try {
            const res = await authFetch('/recipes');
            if(!res.ok) throw new Error();
            d = await res.json();
        } catch(e) {
            document.getElementById('rcBody').innerHTML = '<tr><td colspan="5"><div class="empty-note">Yüklenemedi</div></td></tr>';
            return;
        }
        if(currentPage !== 'recipes') return;
        document.getElementById('rcMenuList').innerHTML = d.menu_names.map(n => `<option value="${esc(n)}">`).join('');
        rcData = {};
        d.recipes.sort((a, b) => a.name.localeCompare(b.name, 'tr'));
        d.recipes.forEach(r => rcData[r.id] = r);
        document.getElementById('rcBody').innerHTML = d.recipes.map(recipeRowHtml).join('');
        rcAfterChange();
        document.querySelectorAll('#rcBody textarea').forEach(autoGrow);
    }

    function recipeRowHtml(r) {
        return `<tr class="rc-row" data-id="${r.id}">
            <td><input class="rc-name" maxlength="80" spellcheck="false" value="${esc(r.name)}" oninput="rcDirty(${r.id})"></td>
            <td><textarea class="rc-ing" rows="1" spellcheck="false" maxlength="2000" oninput="rcDirty(${r.id});autoGrow(this)">${esc(r.ingredients)}</textarea></td>
            <td><textarea class="rc-steps" rows="1" spellcheck="false" maxlength="4000" oninput="rcDirty(${r.id});autoGrow(this)">${esc(r.steps)}</textarea></td>
            <td><button class="rc-save" onclick="saveRecipe(${r.id})">Kaydet</button></td>
            <td><button class="t-del" onclick="delRecipe(${r.id})" title="Reçeteyi sil">✕</button></td>
        </tr>`;
    }

    function autoGrow(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
    const rcRow = id => document.querySelector(`#rcBody tr[data-id="${id}"]`);
    const rcVals = tr => ({ name: tr.querySelector('.rc-name').value,
                            ingredients: tr.querySelector('.rc-ing').value,
                            steps: tr.querySelector('.rc-steps').value });

    // Amber "Kaydet •" while a row differs from its last saved version.
    function rcDirty(id) {
        const tr = rcRow(id), saved = rcData[id];
        if(!tr || !saved) return;
        const v = rcVals(tr);
        const dirty = v.name.trim() !== saved.name || v.ingredients !== saved.ingredients || v.steps !== saved.steps;
        const btn = tr.querySelector('.rc-save');
        btn.classList.toggle('dirty', dirty);
        btn.textContent = dirty ? 'Kaydet •' : 'Kaydet';
    }

    // Empty-state row + count + current search filter.
    function rcAfterChange() {
        const body = document.getElementById('rcBody');
        const n = body.querySelectorAll('tr.rc-row').length;
        const empty = body.querySelector('tr.rc-empty');
        if(!n && !empty) body.innerHTML = '<tr class="rc-empty"><td colspan="5"><div class="empty-note">Henüz reçete yok — yukarıdan ekleyin</div></td></tr>';
        if(n && empty) empty.remove();
        document.getElementById('rcCount').textContent = n ? `(${n})` : '';
        filterRecipes();
    }

    function filterRecipes() {
        const q = (document.getElementById('rcSearch')?.value || '').trim().toLocaleLowerCase('tr');
        document.querySelectorAll('#rcBody tr.rc-row').forEach(tr => {
            const v = rcVals(tr);
            const hay = (v.name + ' ' + v.ingredients + ' ' + v.steps).toLocaleLowerCase('tr');
            tr.style.display = !q || hay.includes(q) ? '' : 'none';
        });
    }

    async function rcPost(url, body) {
        let res;
        try {
            res = await authFetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
        } catch(e) { showToast('Sunucuya ulaşılamadı!'); return null; }
        const d = await res.json().catch(() => ({}));
        if(!res.ok) {
            // FastAPI validation errors come as a list; our own errors as a string.
            showToast(typeof d.detail === 'string' ? d.detail : 'Geçersiz bilgi — reçete adı gerekli');
            return null;
        }
        return d;
    }

    async function addRecipe() {
        const nameEl = document.getElementById('rcNewName');
        const ingEl = document.getElementById('rcNewIng'), stEl = document.getElementById('rcNewSteps');
        const name = nameEl.value.trim();
        if(!name) { showToast('Reçete adı girin'); nameEl.focus(); return; }
        const r = await rcPost('/recipes/add', {name, ingredients: ingEl.value, steps: stEl.value});
        if(!r) return;                                   // form kept as typed
        rcData[r.id] = r;
        // insert at its alphabetical place (Turkish order), without redrawing others
        const body = document.getElementById('rcBody');
        const next = [...body.querySelectorAll('tr.rc-row')].find(tr =>
            (rcData[tr.dataset.id]?.name || '').localeCompare(r.name, 'tr') > 0);
        const tmp = document.createElement('tbody'); tmp.innerHTML = recipeRowHtml(r);
        const tr = tmp.firstElementChild;
        body.insertBefore(tr, next || null);
        tr.querySelectorAll('textarea').forEach(autoGrow);
        nameEl.value = ''; ingEl.value = ''; stEl.value = '';
        [ingEl, stEl].forEach(autoGrow);
        rcAfterChange();
        showToast('Reçete eklendi ✓');
    }

    async function saveRecipe(id) {
        const tr = rcRow(id); if(!tr) return;
        const v = rcVals(tr);
        if(!v.name.trim()) { showToast('Reçete adı boş olamaz'); return; }
        const r = await rcPost('/recipes/update', {id, name: v.name.trim(), ingredients: v.ingredients, steps: v.steps});
        if(!r) return;                                   // edits stay, still marked unsaved
        rcData[id] = r;
        tr.querySelector('.rc-name').value = r.name;
        rcDirty(id);
        showToast('Kaydedildi ✓');
    }

    async function delRecipe(id) {
        const name = rcData[id]?.name || '';
        if(!confirm(`"${name}" reçetesi silinsin mi?`)) return;
        const r = await rcPost('/recipes/delete', {id});
        if(!r) return;
        rcRow(id)?.remove();
        delete rcData[id];
        rcAfterChange();
        showToast('Reçete silindi');
    }

    async function downloadPdf(url, fallbackName) {
        try {
            const res = await authFetch(url);
            if(!res.ok) {
                // Show the server's reason (e.g. "Bitiş tarihi başlangıçtan önce olamaz").
                const d = await res.json().catch(() => ({}));
                showToast(typeof d.detail === 'string' ? d.detail : 'Rapor oluşturulamadı');
                return;
            }
            const blob = await res.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fallbackName;
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(a.href);
            showToast('Rapor indirildi ✓');
        } catch(e) { showToast('Rapor oluşturulamadı'); }
    }

        else if(kind === 'lastMonth') { s = new Date(t.getFullYear(), t.getMonth()-1, 1, 12); e = new Date(t.getFullYear(), t.getMonth(), 0, 12); }

    async function loadMonth() {
        const first=`${calYear}-${String(calMonth+1).padStart(2,'0')}-01`;
        const lastDay=new Date(calYear,calMonth+1,0).getDate();
        const last=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
        try { monthTasks = (await (await authFetch(`/tasks?start=${first}&end=${last}`)).json()).tasks; }
        catch(e){ monthTasks=[]; }
    }

    function renderCalendar() {
        document.getElementById('calMonth').innerText = `${TR_MONTHS[calMonth]} ${calYear}`;
        document.getElementById('calDow').innerHTML = TR_DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
        const firstDow=(new Date(calYear,calMonth,1).getDay()+6)%7; // Mon=0
        const days=new Date(calYear,calMonth+1,0).getDate();
        const today=todayYMD();
        let html='';
        for(let i=0;i<firstDow;i++) html+='<div class="cal-cell empty"></div>';
        for(let d=1;d<=days;d++){
            const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayTasks=monthTasks.filter(t=>t.task_date===ds);
            let dots='';
            dayTasks.slice(0,4).forEach(t=>{
                let cls='cal-dot';
                if(t.done) cls+='';
                else if(ds<today) cls+=' overdue';
                else cls+=' pending';
                dots+=`<span class="${cls}"></span>`;
            });
            const cls=['cal-cell']; if(ds===today)cls.push('today'); if(ds===selectedDate)cls.push('selected');
            html+=`<div class="${cls.join(' ')}" onclick="selectDate('${ds}')">
                     <span class="d">${d}</span><div class="cal-dots">${dots}</div></div>`;
        }
        document.getElementById('calGrid').innerHTML=html;
    }

    function selectDate(ds){ selectedDate=ds; renderCalendar(); renderDayTasks(); }

    function renderDayTasks() {
        if(!selectedDate){ return; }
        const [y,m,d]=selectedDate.split('-');
        document.getElementById('taskDayTitle').innerText = `${d}-${m}-${y} görevleri`;
        const today=todayYMD();
        const list=monthTasks.filter(t=>t.task_date===selectedDate);
        const el=document.getElementById('taskList');
        if(list.length===0){ el.innerHTML='<div class="empty-note">Bu güne görev yok</div>'; return; }
        el.innerHTML = list.map(t=>{
            const overdue = !t.done && t.task_date<today;
            const cls=['task-item']; if(t.done)cls.push('done'); if(overdue)cls.push('overdue');
            return `<li class="${cls.join(' ')}">
                <div class="t-check" onclick="toggleTask(${t.id},${t.done?0:1})">${t.done?'✓':''}</div>
                <div class="t-body"><div class="t-title">${esc(t.title)}</div><div class="t-cat">${esc(t.category)}</div></div>
                ${overdue?'<span class="t-overdue-mark" title="Gecikti">❗</span>':''}
                <button class="t-del" onclick="delTask(${t.id})">✕</button>
            </li>`;
        }).join('');
    }

    async function addTask() {
        const input=document.getElementById('taskInput');
        const title=input.value.trim(); if(!title||!selectedDate) return;
        const category=document.getElementById('taskCat').value;
        await authFetch('/tasks',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({task_date:selectedDate,title,category})});
        input.value='';
        await loadMonth(); renderCalendar(); renderDayTasks();
    }
    async function toggleTask(id,done){
        await authFetch('/tasks/update',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id,done:!!done})});
        await loadMonth(); renderCalendar(); renderDayTasks();
    }
    async function delTask(id){
        await authFetch('/tasks/delete',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id})});
        await loadMonth(); renderCalendar(); renderDayTasks();
    }

    // ===== AYARLAR → MASALAR (areas + table numbers) =====
    // Only the #tablesEditor card is redrawn after a change — the menu editor
    // below (and anything typed there) is never touched.
    let tablesData = null;

    async function tPost(url, body) {
        let res;
        try {
            res = await authFetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
        } catch(e) { showToast('Sunucuya ulaşılamadı!'); return null; }
        const d = await res.json().catch(() => ({}));
        if(!res.ok) { showToast(typeof d.detail === 'string' ? d.detail : 'Geçersiz bilgi'); return null; }
        return d;
    }

    async function loadTablesSettings() {
        const el = document.getElementById('tablesEditor');
        if(!el) return;
        try {
            const res = await authFetch('/tables/all');
            if(!res.ok) throw new Error();
            tablesData = await res.json();
        } catch(e) { el.innerHTML = '<div class="empty-note">Masalar yüklenemedi</div>'; return; }
        const total = tablesData.areas.reduce((n, a) => n + a.tables.length, 0);
        document.getElementById('tablesCount').textContent = `(${tablesData.areas.length} bölge · ${total} masa)`;
        el.innerHTML = (tablesData.areas.length ? tablesData.areas.map(a => `
            <div class="ta-area" data-area="${a.id}">
                <div class="ta-head">
                    <input class="ta-name" id="taName_${a.id}" maxlength="40" value="${esc(a.name)}"
                           onkeydown="if(event.key==='Enter')renameArea(${a.id})">
                    <button class="btn-save-sm" onclick="renameArea(${a.id})">Adı kaydet</button>
                    <span class="ta-count">${a.tables.length} masa</span>
                    <button class="ta-del-area" onclick="deleteArea(${a.id})">🗑 Bölgeyi sil</button>
                </div>
                <div class="ta-chips">
                    ${a.tables.length ? a.tables.map(t => `
                        <span class="ta-chip${t.open ? ' open' : ''}" id="taChip_${t.no}"
                              title="${t.open ? 'Açık adisyon var — silinemez, adı değiştirilebilir' : esc(t.label)}">${esc(t.name)}${t.open ? ' <span class="dot">●</span>' : ''}<button
                              onclick="startRenameTable(${t.no})" title="Adını değiştir">✎</button>${t.open ? '' :
                              `<button onclick="deleteTable(${t.no})" title="${esc(t.label)} sil">✕</button>`}</span>`
                      ).join('') : '<span class="empty-note" style="padding:4px 0;">Bu bölgede masa yok</span>'}
                </div>
                <div class="ta-add">
                    <input id="taAdd_${a.id}" maxlength="200" placeholder="Masa ekle: 16  ·  16-20, 25  ·  Toplantı Masası"
                           onkeydown="if(event.key==='Enter')addTables(${a.id})">
                    <button onclick="addTables(${a.id})">Ekle</button>
                </div>
            </div>`).join('') : '<div class="empty-note">Henüz bölge yok — aşağıdan ekleyin</div>') + `
            <div class="ta-add" style="margin-top:14px;">
                <input id="taNewArea" maxlength="40" placeholder="Yeni bölge adı (örn. Teras)"
                       onkeydown="if(event.key==='Enter')addArea()">
                <button onclick="addArea()">Bölge ekle</button>
            </div>`;
    }

    async function addArea() {
        const el = document.getElementById('taNewArea');
        const name = el.value.trim();
        if(!name) { showToast('Bölge adı girin'); return; }
        if(!await tPost('/tables/area-add', {name})) return;
        showToast('Bölge eklendi ✓ — şimdi masa ekleyin');
        loadTablesSettings();
    }

    async function renameArea(id) {
        const name = document.getElementById('taName_' + id).value.trim();
        if(!name) { showToast('Bölge adı boş olamaz'); return; }
        if(!await tPost('/tables/area-rename', {id, name})) return;
        showToast('Bölge adı kaydedildi ✓');
        loadTablesSettings();
    }

    async function deleteArea(id) {
        const a = tablesData.areas.find(x => x.id === id);
        if(!confirm(`"${a.name}" bölgesi ve ${a.tables.length} masası silinsin mi?\n(Geçmiş satış kayıtları etkilenmez.)`)) return;
        if(!await tPost('/tables/area-delete', {id})) return;
        showToast('Bölge silindi');
        loadTablesSettings();
    }

    async function addTables(areaId) {
        const el = document.getElementById('taAdd_' + areaId);
        const spec = el.value.trim();
        if(!spec) { showToast('Masa numarası veya adı girin'); return; }
        const r = await tPost('/tables/add', {area_id: areaId, spec});
        if(!r) return;                                   // what was typed stays
        showToast(r.added.length === 1 ? `${r.labels[0]} eklendi ✓` : `${r.added.length} masa eklendi ✓`);
        loadTablesSettings();
    }

    function findTable(no) {
        for(const a of (tablesData ? tablesData.areas : [])) {
            const t = a.tables.find(x => x.no === no);
            if(t) return t;
        }
        return null;
    }

    // ✎ on a chip → inline box. Only the NAME changes: the table keeps its
    // internal number, so printed QR codes and an open bill stay as they are.
    function startRenameTable(no) {
        const t = findTable(no), chip = document.getElementById('taChip_' + no);
        if(!t || !chip) return;
        chip.className = 'ta-chip editing';
        chip.innerHTML = `<input id="taRen_${no}" maxlength="30" value="${esc(t.name)}"
                onkeydown="if(event.key==='Enter')renameTable(${no}); if(event.key==='Escape')loadTablesSettings();">
            <button class="ok" onclick="renameTable(${no})" title="Kaydet">✓ Kaydet</button>
            <button onclick="loadTablesSettings()" title="Vazgeç">Vazgeç</button>`;
        const inp = document.getElementById('taRen_' + no);
        inp.focus(); inp.select();
    }

    async function renameTable(no) {
        const inp = document.getElementById('taRen_' + no);
        const name = inp ? inp.value.trim() : '';
        if(!name) { showToast('Masa adı boş olamaz'); return; }
        const t = findTable(no);
        if(t && t.name === name) { loadTablesSettings(); return; }
        const r = await tPost('/tables/rename', {table_no: no, name});
        if(!r) return;                                   // box stays open with what was typed
        showToast(`Masa adı kaydedildi: ${r.label} ✓`);
        loadTablesSettings();
    }

    async function deleteTable(no) {
        const t = findTable(no), label = t ? t.label : `Masa ${no}`;
        if(!confirm(`${label} silinsin mi?\n(Geçmiş satış kayıtları etkilenmez.)`)) return;
        if(!await tPost('/tables/delete', {table_no: no})) return;
        showToast(`${label} silindi`);
        loadTablesSettings();
    }

    // ===== AYARLAR (Menu settings) =====
    let menuData = null;

    function renderSettings() {
        document.getElementById('content').innerHTML = `
            <div class="page-title">Ayarlar</div>
            <div class="page-sub">Masaları ve menüyü düzenleyin.
                Değişiklikler POS, garson ve QR ekranları yenilendiğinde geçerli olur.</div>
            <div class="card" style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
                <div>
                    <h3 style="margin:0 0 4px;">🔳 Masa QR Kodları</h3>
                    <div class="page-sub" style="margin:0;">Tüm masaların QR kodlarını tek sayfada açıp yazdırın.</div>
                </div>
                <a href="/qr-codes" target="_blank"
                   style="padding:10px 18px;background:var(--ink);color:var(--cream);border-radius:8px;font-weight:bold;text-decoration:none;">QR kodlarını aç / yazdır</a>
            </div>
            <div class="card" style="margin-bottom:16px;">
                <h3>🪑 Masalar ve Bölgeler <span id="tablesCount" style="color:var(--muted);font-weight:normal;"></span></h3>
                <div class="page-sub" style="margin:0 0 10px;">Masa eklerken numara (16, 16-20) veya isim (Toplantı Masası) yazın; isimler tüm bölgelerde benzersiz olmalı.
                    ✎ ile adı değiştirin — QR kodu ve açık adisyon aynı kalır, yeniden yazdırmak gerekmez.
                    Açık adisyonu olan masa (●) silinemez. Yeni masalar için QR kodlarını yazdırmayı unutmayın.</div>
                <div id="tablesEditor"><div class="empty-note">Yükleniyor…</div></div>
            </div>
            <div class="page-title" style="font-size:18px;margin:22px 0 10px;">Menü</div>
            <div class="card" style="margin-bottom:16px;">
                <h3>➕ Yeni Ürün Ekle</h3>
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                    <input id="miCat" list="catList" placeholder="Bölüm (örn. TEAS)"
                           style="flex:2;min-width:150px;padding:10px;border:1px solid var(--line);border-radius:8px;">
                    <datalist id="catList"></datalist>
                    <input id="miName" placeholder="Ürün adı"
                           style="flex:2;min-width:150px;padding:10px;border:1px solid var(--line);border-radius:8px;">
                    <input id="miPrice" type="number" min="0" step="1" placeholder="Fiyat ₺"
                           style="flex:1;min-width:90px;padding:10px;border:1px solid var(--line);border-radius:8px;">
                    <button onclick="addMenuItem()"
                            style="padding:10px 18px;background:var(--ink);color:var(--cream);border:none;border-radius:8px;font-weight:bold;cursor:pointer;">Ekle</button>
                </div>
                <div class="page-sub" style="margin:8px 0 0;">Yeni bir bölüm adı yazarsanız o bölüm otomatik oluşturulur.</div>
            </div>
            <div id="menuSections"><div class="empty-note">Yükleniyor…</div></div>`;
        loadTablesSettings();
        loadMenuSettings();
    }

    async function loadMenuSettings() {
        try { menuData = await (await authFetch('/menu/all')).json(); }
        catch(e){ menuData = {sections:[], categories:[]}; }
        document.getElementById('catList').innerHTML =
            menuData.categories.map(c=>`<option value="${esc(c)}">`).join('');
        const wrap = document.getElementById('menuSections');
        if(!menuData.sections.length){
            wrap.innerHTML='<div class="empty-note">Menü boş. Yukarıdan ürün ekleyin.</div>'; return;
        }
        wrap.innerHTML = menuData.sections.map((sec,i)=>`
            <div class="card" style="margin-bottom:14px;">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
                    <h3 style="margin:0;">${esc(sec.category)} <span style="color:var(--muted);font-weight:normal;">(${sec.items.length})</span></h3>
                    <div style="display:flex;gap:6px;">
                        <button onclick="renameSection(${i})"
                                style="padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:12px;">✎ Bölüm adı</button>
                        <button onclick="deleteSection(${i})"
                                style="padding:6px 10px;border:1px solid var(--red);color:var(--red);background:#fff;border-radius:7px;cursor:pointer;font-size:12px;">🗑 Bölümü sil</button>
                    </div>
                </div>
                <table style="width:100%;border-collapse:collapse;font-size:13px;">
                    ${sec.items.map(it=>`
                        <tr style="border-bottom:1px solid var(--line);">
                            <td style="padding:7px 4px;">
                                <input id="mn_${it.id}" value="${esc(it.name)}"
                                       style="width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;"></td>
                            <td style="padding:7px 4px;width:130px;white-space:nowrap;">
                                <input id="mp_${it.id}" type="number" min="0" step="1" value="${it.price}"
                                       style="width:95px;padding:8px;border:1px solid var(--line);border-radius:7px;text-align:right;"> ₺</td>
                            <td style="width:80px;">
                                <button onclick="saveMenuItem(${it.id})"
                                        style="padding:7px 12px;background:var(--green);color:#fff;border:none;border-radius:7px;font-weight:bold;cursor:pointer;">Kaydet</button></td>
                            <td style="width:36px;"><button class="t-del" onclick="deleteMenuItem(${it.id})">✕</button></td>
                        </tr>`).join('')}
                </table>
            </div>`).join('');
    }

    function findMenuItem(id){
        for(const s of menuData.sections){ const it=s.items.find(x=>x.id===id); if(it) return it; }
        return null;
    }

    async function addMenuItem(){
        const category=document.getElementById('miCat').value.trim();
        const name=document.getElementById('miName').value.trim();
        const price=parseFloat(document.getElementById('miPrice').value);
        if(!category||!name){ showToast('Bölüm ve ürün adı girin'); return; }
        if(isNaN(price)||price<0){ showToast('Geçerli fiyat girin'); return; }
        const res=await authFetch('/menu/add-item',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({category,name,price})});
        if(!res.ok){ const d=await res.json().catch(()=>({})); showToast(d.detail||'Eklenemedi'); return; }
        document.getElementById('miName').value=''; document.getElementById('miPrice').value='';
        showToast('Ürün eklendi ✓');
        loadMenuSettings();
    }

    async function saveMenuItem(id){
        const name=document.getElementById('mn_'+id).value.trim();
        const price=parseFloat(document.getElementById('mp_'+id).value);
        if(!name){ showToast('Ürün adı boş olamaz'); return; }
        if(isNaN(price)||price<0){ showToast('Geçerli fiyat girin'); return; }
        const res=await authFetch('/menu/update-item',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id,name,price})});
        if(!res.ok){ const d=await res.json().catch(()=>({})); showToast(d.detail||'Kaydedilemedi'); return; }
        showToast('Kaydedildi ✓');
        loadMenuSettings();
    }

    async function deleteMenuItem(id){
        const it=findMenuItem(id);
        if(!confirm(`"${it?it.name:''}" menüden silinsin mi?`)) return;
        await authFetch('/menu/delete-item',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id})});
        showToast('Silindi');
        loadMenuSettings();
    }

    async function renameSection(i){
        const sec=menuData.sections[i];
        const nn=prompt('Yeni bölüm adı:', sec.category);
        if(nn===null) return;
        const nv=nn.trim();
        if(!nv||nv===sec.category) return;
        await authFetch('/menu/rename-section',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({old:sec.category, new:nv})});
        showToast('Bölüm güncellendi ✓');
        loadMenuSettings();
    }

    async function deleteSection(i){
        const sec=menuData.sections[i];
        if(!confirm(`"${sec.category}" bölümü ve içindeki ${sec.items.length} ürün silinsin mi?`)) return;
        await authFetch('/menu/delete-section',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({category:sec.category})});
        showToast('Bölüm silindi');
        loadMenuSettings();
    }

    // boot
    document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkPin();});
    if(AUTH_TOKEN){
        document.getElementById('pinModal').style.display='none';
        document.getElementById('app').style.display='flex';
        nav('home', document.querySelector('.nav-item'));
    }
</script>
</body>
</html>
